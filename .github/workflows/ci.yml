name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm test

  action-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Run the composite action against this repository
        uses: ./
        with:
          directory: .
          format: cli

      - name: Run the composite action with JSON output
        id: json-run
        uses: ./
        with:
          directory: .
          format: json
          output-file: orphan.json

      - name: Verify the action published its outputs
        run: |
          test -s orphan.json
          test -n "${{ steps.json-run.outputs.unused-count }}"
          test -n "${{ steps.json-run.outputs.total-files }}"
          test "${{ steps.json-run.outputs.report-file }}" = "orphan.json"
          echo "unused=${{ steps.json-run.outputs.unused-count }} of ${{ steps.json-run.outputs.total-files }} files"

      - name: Verify the comment step degrades without a token
        run: |
          OUTPUT=$(COMMENT_TOKEN="" node .github/actions/pr-comment.mjs orphan.json)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "No token supplied"
