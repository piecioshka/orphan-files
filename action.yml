name: "orphan-files"
description: "Find unused files in JavaScript/TypeScript projects by analysing the import graph. Supports SARIF for GitHub code scanning."
branding:
  icon: "trash-2"
  color: "blue"
inputs:
  directory:
    description: "Project directory to scan"
    required: false
    default: "."
  format:
    description: "Output format: cli, json, sarif, pdf"
    required: false
    default: "cli"
  args:
    description: 'Extra CLI arguments (e.g. "--baseline .orphan-files-baseline.json --max-unused 5")'
    required: false
    default: ""
  output-file:
    description: "Write the report to this file instead of stdout (useful for SARIF upload)"
    required: false
    default: ""
  version:
    description: "npm version/tag of orphan-files to run"
    required: false
    default: "latest"
runs:
  using: "composite"
  steps:
    - name: Run orphan-files
      run: |
        if [ -n "$OUTPUT_FILE" ]; then
          npx --yes "orphan-files@$VERSION" "$DIRECTORY" --format "$FORMAT" $ARGS < /dev/null > "$OUTPUT_FILE"
        else
          npx --yes "orphan-files@$VERSION" "$DIRECTORY" --format "$FORMAT" $ARGS < /dev/null
        fi
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DIRECTORY: ${{ inputs.directory }}
        FORMAT: ${{ inputs.format }}
        ARGS: ${{ inputs.args }}
        OUTPUT_FILE: ${{ inputs.output-file }}
