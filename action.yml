name: "orphan-files"
description: "Find unused files in JavaScript/TypeScript projects by analysing the import graph. Supports SARIF for GitHub code scanning."
branding:
  icon: "trash-2"
  color: "blue"
inputs:
  directory:
    description: "Project directory to scan"
    required: false
    default: "."
  format:
    description: "Output format: cli, json, sarif, pdf"
    required: false
    default: "cli"
  args:
    description: 'Extra CLI arguments (e.g. "--baseline .orphan-files-baseline.json --max-unused 5")'
    required: false
    default: ""
  output-file:
    description: "Write the report to this file instead of stdout (useful for SARIF upload)"
    required: false
    default: ""
  version:
    description: "npm version/tag of orphan-files to run"
    required: false
    default: "latest"
  comment:
    description: "Comment the report on the pull request (updates one comment in place)"
    required: false
    default: "false"
  token:
    description: "Token used to post the comment. Needs pull-requests: write."
    required: false
    default: ${{ github.token }}
outputs:
  unused-count:
    description: "Number of unused files found. Only set when format is json, otherwise empty."
    value: ${{ steps.run.outputs.unused-count }}
  reclaimable-bytes:
    description: "Total size of the unused files in bytes. Only set when format is json, otherwise empty."
    value: ${{ steps.run.outputs.reclaimable-bytes }}
  total-files:
    description: "Number of files scanned. Only set when format is json, otherwise empty."
    value: ${{ steps.run.outputs.total-files }}
  report-file:
    description: "Path the report was written to, when output-file was given."
    value: ${{ steps.run.outputs.report-file }}
runs:
  using: "composite"
  steps:
    - name: Run orphan-files
      id: run
      run: |
        set -o pipefail

        # Split the free-form args input into words without letting the shell
        # glob or word-split on anything else in the workspace.
        set -f
        # shellcheck disable=SC2206
        EXTRA=($ARGS)
        set +f

        if [ -n "$OUTPUT_FILE" ]; then
          REPORT="$OUTPUT_FILE"
          echo "report-file=$REPORT" >> "$GITHUB_OUTPUT"
        else
          REPORT="$(mktemp)"
        fi

        STATUS=0
        npx --yes "orphan-files@$VERSION" "$DIRECTORY" \
          --format "$FORMAT" "${EXTRA[@]}" < /dev/null > "$REPORT" || STATUS=$?

        # Without an output-file the report is the step's own stdout.
        if [ -z "$OUTPUT_FILE" ]; then
          cat "$REPORT"
        fi

        # Only the JSON report is machine-readable, so that is the one case
        # where the counts can be published without a second scan.
        if [ "$FORMAT" = "json" ]; then
          node -e '
            const fs = require("fs");
            let report;
            try {
              report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            } catch {
              process.exit(0);
            }
            const lines = [
              `unused-count=${report.unusedCount ?? ""}`,
              `reclaimable-bytes=${report.reclaimableBytes ?? ""}`,
              `total-files=${report.totalFiles ?? ""}`,
            ];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
          ' "$REPORT"
        fi

        [ -n "$OUTPUT_FILE" ] || rm -f "$REPORT"
        exit "$STATUS"
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DIRECTORY: ${{ inputs.directory }}
        FORMAT: ${{ inputs.format }}
        ARGS: ${{ inputs.args }}
        OUTPUT_FILE: ${{ inputs.output-file }}

    - name: Comment the report on the pull request
      # Runs even when the scan step failed, because a failing scan is exactly
      # the case worth reporting on the pull request.
      if: ${{ always() && inputs.comment == 'true' && github.event_name != 'schedule' }}
      run: |
        set -eo pipefail

        set -f
        # shellcheck disable=SC2206
        EXTRA=($ARGS)
        set +f

        # The comment needs the machine-readable report. Reuse the one the scan
        # already produced when it was JSON; otherwise scan once more for it.
        if [ "$FORMAT" = "json" ] && [ -n "$OUTPUT_FILE" ]; then
          REPORT="$OUTPUT_FILE"
        else
          REPORT="$(mktemp)"
          npx --yes "orphan-files@$VERSION" "$DIRECTORY" \
            --format json "${EXTRA[@]}" < /dev/null > "$REPORT" || true
        fi

        node "$GITHUB_ACTION_PATH/.github/actions/pr-comment.mjs" "$REPORT"
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DIRECTORY: ${{ inputs.directory }}
        FORMAT: ${{ inputs.format }}
        ARGS: ${{ inputs.args }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        COMMENT_TOKEN: ${{ inputs.token }}
