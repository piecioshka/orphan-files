name: 'orphan-files'
description: 'Find unused files in JavaScript/TypeScript projects by analysing the import graph.'
branding:
  icon: 'trash-2'
  color: 'blue'
inputs:
  directory:
    description: 'Project directory to scan'
    required: false
    default: '.'
  format:
    description: 'Output format: cli, json, sarif, pdf'
    required: false
    default: 'cli'
  args:
    description: 'Extra CLI arguments (e.g. "--baseline .orphan-files-baseline.json")'
    required: false
    default: ''
  version:
    description: 'npm version/tag of orphan-files to run'
    required: false
    default: 'latest'
runs:
  using: 'composite'
  steps:
    - run: npx --yes orphan-files@${{ inputs.version }} "${{ inputs.directory }}" --format "${{ inputs.format }}" ${{ inputs.args }}
      shell: bash
