<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="orphan-files logo">
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#163450"/>

  <!-- Reachable dependency graph: edges -->
  <g stroke="#3f7cb0" stroke-width="4.5" stroke-linecap="round">
    <line x1="44" y1="42" x2="64" y2="66"/>
    <line x1="84" y1="40" x2="64" y2="66"/>
    <line x1="40" y1="80" x2="64" y2="66"/>
    <line x1="44" y1="42" x2="40" y2="80"/>
  </g>

  <!-- Severed link to the orphan (broken, dashed) -->
  <line x1="71" y1="71" x2="85" y2="87" stroke="#f5b942" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 7" opacity="0.6"/>

  <!-- Reachable nodes -->
  <g fill="#5aa6e6" stroke="#163450" stroke-width="3">
    <circle cx="44" cy="42" r="9"/>
    <circle cx="84" cy="40" r="9"/>
    <circle cx="64" cy="66" r="10"/>
    <circle cx="40" cy="80" r="9"/>
  </g>

  <!-- Orphan node (unreachable from any entry point) -->
  <circle cx="94" cy="96" r="14" fill="none" stroke="#f5b942" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.5"/>
  <circle cx="94" cy="96" r="9.5" fill="#f5b942" stroke="#163450" stroke-width="3"/>
</svg>
